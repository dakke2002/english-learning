version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=change-this-to-a-random-secret-key-in-production
    volumes:
      - db-data:/app/database.sqlite

volumes:
  db-data:
